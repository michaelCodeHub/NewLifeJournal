[project]
name = "bloom-e2e"
version = "0.1.0"
description = "Agentic AI end-to-end testing for Bloom & Bump (Android emulator)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[project.scripts]
bloom-e2e = "bloom_e2e.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bloom_e2e*"]
